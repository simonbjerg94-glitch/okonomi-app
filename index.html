<!doctype html>
<html lang="da" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Min Økonomi</title>
  <meta name="description" content="Overblik over løn, udgifter, budget og opsparingsmål">
  <meta name="theme-color" content="#0b0d17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Økonomi">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    try { const t = JSON.parse(localStorage.getItem('okonomi.v1') || '{}')?.settings?.theme; if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="36" height="36">
        <div><strong>Min Økonomi</strong><small>Simons overblik</small></div>
      </div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-foot">
        <button class="btn btn-primary btn-block" data-action="add-tx">＋ Ny postering</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <span class="eyebrow" id="greeting">Hej</span>
          <h1 id="viewTitle">Overblik</h1>
        </div>
        <div class="topbar-actions">
          <div class="month-picker" id="monthPicker">
            <button class="icon-btn" data-action="prev-month" aria-label="Forrige måned">‹</button>
            <span id="monthLabel">–</span>
            <button class="icon-btn" data-action="next-month" aria-label="Næste måned">›</button>
          </div>
          <button class="icon-btn theme-btn" data-action="toggle-theme" aria-label="Skift tema" title="Skift lyst/mørkt tema"></button>
        </div>
      </header>
      <div id="banner"></div>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <nav class="bottom-nav" id="bottomNav"></nav>
  <button class="fab" data-action="quick-add" aria-label="Ny postering">＋</button>

  <div id="modalRoot"></div>
  <div id="toast" role="status"></div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
